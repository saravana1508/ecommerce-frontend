<header class="navbar-wrapper">

  <!-- ===== Top Strip: Logo | Search | Actions ===== -->
  <div class="navbar-top">
    <div class="navbar-inner">

      <!-- Logo -->
      <a class="navbar-logo" routerLink="/" (click)="closeMenu()">
        <span class="logo-icon">🛒</span>
        <span class="logo-text">Shop<span class="logo-accent">Ease</span></span>
      </a>

      <!-- Search Bar -->
      <div class="navbar-search">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search for products, brands and more..."
          class="search-input"
          aria-label="Search products"
        />
        <button class="search-btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="navbar-actions">

        <a routerLink="/wishlist" class="nav-action-btn" routerLinkActive="nav-action-active" (click)="closeMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span>Wishlist</span>
        </a>

        <a routerLink="/cart" class="nav-action-btn cart-btn" routerLinkActive="nav-action-active" (click)="closeMenu()">
          <span class="cart-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-badge">3</span>
          </span>
          <span>Cart</span>
        </a>

        <a routerLink="/login" class="nav-login-btn" (click)="closeMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login
        </a>
      </div>

      <!-- Hamburger Button (mobile only) -->
      <button
        class="hamburger-btn"
        [ngClass]="{ open: menuOpen }"
        (click)="toggleMenu()"
        aria-label="Toggle navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </div>

  <!-- ===== Bottom Strip: Main Nav Links & Categories ===== -->
  <nav class="navbar-bottom" [ngClass]="{ 'mobile-open': menuOpen }">
    <div class="navbar-inner">

      <ul class="nav-links">
        <li>
          <a routerLink="/"
            routerLinkActive="nav-link-active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">
            🏠 Home
          </a>
        </li>
        <li>
          <a routerLink="/products" routerLinkActive="nav-link-active" (click)="closeMenu()">
            🏪 Products
          </a>
        </li>
        <li>
          <a routerLink="/cart" routerLinkActive="nav-link-active" (click)="closeMenu()">
            🛒 Cart
          </a>
        </li>
        <li>
          <a routerLink="/wishlist" routerLinkActive="nav-link-active" (click)="closeMenu()">
            ♡ Wishlist
          </a>
        </li>
        <li>
          <a routerLink="/orders" routerLinkActive="nav-link-active" (click)="closeMenu()">
            📦 Orders
          </a>
        </li>
        <li>
          <a routerLink="/login" routerLinkActive="nav-link-active" (click)="closeMenu()">
            👤 Login
          </a>
        </li>
      </ul>

      <!-- Category pill links (hidden on mobile menu for simplicity) -->
      <div class="nav-categories">
        @for (cat of categories; track cat) {
          <a routerLink="/products" class="cat-pill" (click)="closeMenu()">{{ cat }}</a>
        }
      </div>

    </div>
  </nav>

  <!-- Mobile overlay -->
  @if (menuOpen) {
    <div class="mobile-overlay" (click)="closeMenu()"></div>
  }

</header>
