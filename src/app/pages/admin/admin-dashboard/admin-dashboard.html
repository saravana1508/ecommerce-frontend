<div class="dashboard-container">

  <!-- Welcome Section -->
  <div class="welcome-section">
    <div class="welcome-content">
      <h1 class="welcome-title">Welcome Back, Admin! 👋</h1>
      <p class="welcome-subtitle">Here's what's happening in your store today</p>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div *ngFor="let stat of stats" class="stat-card" [ngClass]="{ 'trend-up': stat.trendUp }">
      <div class="stat-header">
        <div class="stat-icon" [style.background]="'rgba(' + hexToRgb(stat.color) + ', 0.1)'">
          {{ stat.icon }}
        </div>
        <div class="stat-trend" *ngIf="stat.trend" [ngClass]="{ 'up': stat.trendUp, 'down': !stat.trendUp }">
          {{ stat.trend }}
        </div>
      </div>
      <div class="stat-content">
        <div class="stat-label">{{ stat.label }}</div>
        <div class="stat-value">{{ stat.value }}</div>
      </div>
    </div>
  </div>

  <!-- Content Grid -->
  <div class="content-grid">

    <!-- Quick Actions -->
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Quick Actions</h3>
      </div>
      <div class="card-body">
        <div class="quick-actions">
          <a href="/admin/shipping-partner" class="action-btn">
            <span class="action-icon">🚚</span>
            <span>Manage Partners</span>
          </a>
          <a href="/admin/inventory" class="action-btn">
            <span class="action-icon">📦</span>
            <span>View Inventory</span>
          </a>
          <button class="action-btn">
            <span class="action-icon">📊</span>
            <span>Generate Reports</span>
          </button>
          <button class="action-btn">
            <span class="action-icon">⚙️</span>
            <span>Settings</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Recent Activities -->
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Recent Activities</h3>
      </div>
      <div class="card-body">
        <div class="activity-list">
          <div *ngFor="let activity of recentActivities" class="activity-item">
            <div class="activity-icon">{{ activity.icon }}</div>
            <div class="activity-content">
              <div class="activity-action">{{ activity.action }}</div>
              <div class="activity-time">{{ activity.time }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
